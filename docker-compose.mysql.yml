services:
  mysql:
    image: mysql:8.0
    container_name: graduation_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123"
      MYSQL_DATABASE: graduation_db
      MYSQL_USER: graduation_backend
      MYSQL_PASSWORD: "123"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "graduation_backend", "-p123"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - graduation_net

volumes:
  mysql_data:

networks:
  graduation_net:
    name: graduation_net
    driver: bridge
